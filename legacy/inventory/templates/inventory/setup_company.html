{% extends "inventory/base.html" %}
{% block title %}Set up shop{% endblock %}
{% block content %}
<div class="mx-auto w-full max-w-md">
    <h1 class="text-3xl font-semibold tracking-tight">Welcome</h1>
    <p class="mt-2 text-sm text-muted">You’re signed in as {{ request.user.username }}. Create your business to continue.</p>
    <div class="card mt-6 p-5 sm:p-8">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Business name</span>
                <input type="text" name="company_name" required autofocus placeholder="e.g. Quality Star Electronics" class="field h-12"></label>
            <button type="submit" class="btn-primary h-12 w-full">Create shop</button>
        </form>
    </div>
</div>
{% endblock %}
