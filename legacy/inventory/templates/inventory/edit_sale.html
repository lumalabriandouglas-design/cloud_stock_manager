{% extends "inventory/base.html" %}
{% load shop %}
{% block title %}Edit sale – {{ company.name }}{% endblock %}
{% block content %}
<div>
    <a href="{% url 'sell' %}" class="text-sm text-muted hover:text-ink">← Back to sell</a>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight">Fix this sale</h1>
    <p class="mt-1 text-sm text-muted">Change the product, quantity, or price. Stock will be corrected.</p>
</div>
<section class="card mt-6 max-w-lg p-5 sm:p-6">
    <form method="post" class="space-y-3">
        {% csrf_token %}
        <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Product</span>
            <select name="item_id" required class="field">
                {% for item in items %}
                <option value="{{ item.id }}" {% if item.id == sale.item_id %}selected{% endif %}>{{ item.name }} ({{ item.stock_label }})</option>
                {% endfor %}
            </select>
        </label>
        <div class="grid grid-cols-2 gap-3">
            <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Qty</span>
                <input type="number" name="quantity" min="0.001" step="0.001" value="{{ sale.quantity_sold }}" required class="field"></label>
            <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Price this sale</span>
                <input type="number" step="0.01" name="sell_price" value="{{ sale.sell_price }}" class="field"></label>
        </div>
        <button type="submit" class="btn-primary w-full">Save change</button>
    </form>
</section>
{% endblock %}
