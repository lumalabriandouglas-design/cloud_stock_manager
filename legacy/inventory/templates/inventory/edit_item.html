{% extends "inventory/base.html" %}
{% block title %}Edit {{ item.name }}{% endblock %}
{% block content %}
<h1 class="text-3xl font-semibold tracking-tight">{{ item.name }}</h1>
<p class="mt-1 text-sm text-muted">Current stock: {{ item.stock_label }}</p>

<section class="card mt-6 overflow-hidden">
    <form method="post" class="space-y-4 p-5">
        {% csrf_token %}
        <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Product name</span>
            <input type="text" name="name" value="{{ item.name }}" required class="field"></label>
        <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Sold as</span>
            <select name="unit" class="field">
                <option value="pcs" {% if item.unit == "pcs" %}selected{% endif %}>Pieces</option>
                <option value="kg" {% if item.unit == "kg" %}selected{% endif %}>Kilograms</option>
            </select>
            <span class="mt-1 block text-[11px] text-muted">Buy and sell prices are {{ item.price_hint }}.</span>
        </label>
        <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Category</span>
            <select name="category_id" class="field">
                <option value="">Uncategorized</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if item.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </label>
        <div class="grid grid-cols-2 gap-3">
            <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Buy price</span>
                <input type="number" step="0.01" name="buy_price" value="{{ item.buy_price }}" class="field"></label>
            <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Sell price</span>
                <input type="number" step="0.01" name="sell_price" value="{{ item.sell_price }}" class="field"></label>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Reorder level</span>
                <input type="number" step="0.001" name="reorder_level" value="{{ item.reorder_level }}" min="0" class="field"></label>
            {% if can_manage_stock %}
            <label class="block"><span class="mb-1.5 block text-xs font-medium text-muted">Adjust stock (+/−)</span>
                <input type="number" step="0.001" name="qty_adjust" placeholder="e.g. 5 or -0.5" class="field"></label>
            {% endif %}
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary flex-1">Save changes</button>
            <a href="{% url 'dashboard' %}" class="inline-flex h-11 items-center rounded-md px-4 text-sm text-muted">Cancel</a>
        </div>
    </form>
    <form method="post" action="{% url 'delete_item' item.id %}" class="px-5 pb-5" onsubmit="return confirm('Remove this product? Sales history stays.');">
        {% csrf_token %}
        <button class="text-sm text-danger">Remove product</button>
    </form>
</section>
{% endblock %}
