<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ item.name }} – {{ company.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

<header class="bg-white border-b border-slate-200">
    <div class="max-w-xl mx-auto px-4 h-14 flex items-center justify-between">
        <a href="{% url 'dashboard' %}" class="text-sm font-medium text-slate-600 hover:text-slate-900">← Back</a>
        <span class="text-sm text-slate-400">Edit product</span>
    </div>
</header>

<main class="max-w-xl mx-auto px-4 py-6 sm:py-8">

    {% if messages %}
    <div class="space-y-2 mb-6">
        {% for message in messages %}
        <div class="rounded-lg px-4 py-3 text-sm {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border border-rose-100{% else %}bg-emerald-50 text-emerald-800 border border-emerald-100{% endif %}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="bg-white rounded-xl border border-slate-200/80 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100">
            <h1 class="text-sm font-semibold text-slate-800">{{ item.name }}</h1>
            <p class="text-xs text-slate-400 mt-0.5">Current stock: <span class="font-medium text-slate-700">{{ item.quantity_in_stock }}</span></p>
        </div>
        <form method="post" class="p-5 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Product name</label>
                <input type="text" name="name" value="{{ item.name }}" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/40 bg-slate-50/50">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Category</label>
                <select name="category_id" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/40 bg-slate-50/50">
                    <option value="">Uncategorized</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if item.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Buy price</label>
                    <input type="number" step="0.01" name="buy_price" value="{{ item.buy_price }}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/40 bg-slate-50/50">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Sell price</label>
                    <input type="number" step="0.01" name="sell_price" value="{{ item.sell_price }}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/40 bg-slate-50/50">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Reorder level</label>
                    <input type="number" name="reorder_level" value="{{ item.reorder_level }}" min="0" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/40 bg-slate-50/50">
                </div>
                {% if can_manage_stock %}
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Adjust stock (+/−)</label>
                    <input type="number" name="qty_adjust" placeholder="e.g. 5 or -2" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/40 bg-slate-50/50">
                </div>
                {% endif %}
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg transition">Save changes</button>
                <a href="{% url 'dashboard' %}" class="px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-600 hover:bg-slate-50 transition">Cancel</a>
            </div>
        </form>
        <form method="post" action="{% url 'delete_item' item.id %}" class="px-5 pb-5" onsubmit="return confirm('Remove this product? Sales history stays.');">
            {% csrf_token %}
            <button class="text-sm text-rose-600 hover:text-rose-800">Remove product</button>
        </form>
    </div>

</main>
</body>
</html>
