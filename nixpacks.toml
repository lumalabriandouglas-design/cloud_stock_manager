# Force Node only. The Django project under legacy/ has requirements.txt
# and would otherwise pull in the Python provider and break the install.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
NPM_CONFIG_ENGINE_STRICT = "false"
CI = "true"

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node scripts/start-railway.mjs"
