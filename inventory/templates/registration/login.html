<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Cloud Stock Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex h-12 w-12 bg-emerald-500 rounded-xl items-center justify-center font-bold text-white text-xl shadow-md shadow-emerald-500/20 mb-4">CS</div>
            <h1 class="text-2xl font-bold text-slate-900">Cloud Stock Manager</h1>
            <p class="text-sm text-slate-500 mt-1">Sign in to your inventory hub</p>
        </div>

        {% if form.errors %}
        <div class="bg-rose-50 text-rose-700 p-3 rounded-lg text-sm mb-5 text-center font-medium border border-rose-200">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Username</label>
                <input type="text" name="username" required autofocus
                    class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Password</label>
                <input type="password" name="password" required
                    class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow-sm transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            New business? <a href="{% url 'register' %}" class="text-emerald-600 font-medium hover:underline">Create an account</a>
        </p>
    </div>
</body>
</html>
