<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – Cloud Stock Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex h-12 w-12 bg-emerald-500 rounded-xl items-center justify-center font-bold text-white text-xl shadow-md shadow-emerald-500/20 mb-4">CS</div>
            <h1 class="text-2xl font-bold text-slate-900">Create your business</h1>
            <p class="text-sm text-slate-500 mt-1">Free account – start managing stock in minutes</p>
        </div>

        {% if messages %}
        <div class="space-y-2 mb-5">
            {% for message in messages %}
            <div class="rounded-lg px-4 py-3 text-sm font-medium bg-rose-50 text-rose-800 border border-rose-200">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Business Name</label>
                <input type="text" name="company_name" required placeholder="e.g. Quality Star Electronics"
                    class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email (optional)</label>
                <input type="email" name="email"
                    class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" name="password" required minlength="6"
                        class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Confirm</label>
                    <input type="password" name="password2" required minlength="6"
                        class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow-sm transition">
                Create Account & Business
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Already have an account? <a href="{% url 'login' %}" class="text-emerald-600 font-medium hover:underline">Sign in</a>
        </p>
    </div>
</body>
</html>
