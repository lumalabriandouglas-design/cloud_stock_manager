<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ item.name }} – {{ company.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-slate-900 border-b border-slate-800">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="{% url 'dashboard' %}" class="text-white font-semibold hover:text-emerald-400">← Back to Dashboard</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
        {% if messages %}
        <div class="space-y-2 mb-6">
            {% for message in messages %}
            <div class="rounded-lg px-4 py-3 text-sm font-medium {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border border-rose-200{% else %}bg-emerald-50 text-emerald-800 border border-emerald-200{% endif %}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 bg-slate-900">
                <h1 class="text-white font-semibold">Edit Product</h1>
                <p class="text-slate-400 text-sm mt-1">Current stock: <strong class="text-white">{{ item.quantity_in_stock }}</strong></p>
            </div>
            <form method="post" class="p-6 space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Product Name</label>
                    <input type="text" name="name" value="{{ item.name }}" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Category</label>
                    <select name="category_id" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                        <option value="">Uncategorized</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if item.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Buy Price (UGX)</label>
                        <input type="number" step="0.01" name="buy_price" value="{{ item.buy_price }}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Sell Price (UGX)</label>
                        <input type="number" step="0.01" name="sell_price" value="{{ item.sell_price }}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Reorder Level</label>
                        <input type="number" name="reorder_level" value="{{ item.reorder_level }}" min="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Adjust Stock (+/-)</label>
                        <input type="number" name="qty_adjust" placeholder="e.g. 5 or -2" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                        <p class="text-xs text-slate-400 mt-1">Leave blank to keep current quantity</p>
                    </div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm">Save Changes</button>
                    <a href="{% url 'dashboard' %}" class="px-5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
