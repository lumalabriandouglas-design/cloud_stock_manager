<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set up your company – Cloud Stock Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex h-12 w-12 bg-emerald-500 rounded-xl items-center justify-center font-bold text-white text-xl shadow-md shadow-emerald-500/20 mb-4">
                CS
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Welcome!</h1>
            <p class="text-sm text-slate-500 mt-2">
                You’re signed in as <strong>{{ request.user.username }}</strong>.<br>
                Create your business to start managing stock.
            </p>
        </div>

        {% if messages %}
        <div class="space-y-2 mb-5">
            {% for message in messages %}
            <div class="rounded-lg px-4 py-3 text-sm font-medium
                {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border border-rose-200
                {% else %}bg-slate-50 text-slate-800 border border-slate-200{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">
                    Business / Company Name
                </label>
                <input type="text" name="company_name" required autofocus
                    placeholder="e.g. Quality Star Electronics"
                    class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow-sm transition">
                Create Company & Continue
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            You will become the <strong>Owner</strong> of this company.
        </p>
    </div>
</body>
</html>
